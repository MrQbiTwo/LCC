<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ page.title | escape }} · LittleCCompiler</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  <link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/vendor/fontawesome/css/fontawesome.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/vendor/fontawesome/css/solid.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="shell header-row">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="LittleCCompiler home">
        <img class="brand-logo" src="{{ '/assets/logo.svg' | relative_url }}" alt="LCC" width="82" height="38">
        <span class="brand-label">Release archive</span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}" {% if page.nav == 'home' %}aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/releases/' | relative_url }}" {% if page.nav == 'releases' %}aria-current="page"{% endif %}>Release Finder</a>
        <a href="{{ '/developers/' | relative_url }}" {% if page.nav == 'developers' %}aria-current="page"{% endif %}>Authors</a>
      </nav>
      <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch theme"><i class="fa-solid fa-moon" aria-hidden="true"></i></button>
    </div>
  </header>
  <div class="prototype-strip"><div class="shell"><span class="prototype-label">Preview</span> Sample releases · Results are simulated</div></div>
  <main id="main" class="shell">{{ content }}</main>
  <footer class="site-footer">
    <div class="shell footer-row">
      <div><strong>LittleCCompiler Licensed Under the MIT License.</strong><br>Sergey Sherbakov and Others 2026.</div>
      <div class="footer-links"><a href="https://littleccompiler.org/">Main website <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i></a><a href="https://github.com/MrQbiTwo/LCC">GitHub</a><a href="{{ '/LICENSE' | relative_url }}">License</a></div>
    </div>
  </footer>
</body>
</html>
